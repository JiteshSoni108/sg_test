services:
  request-management:
    build:
      context: .
      dockerfile: Dockerfile
    image: request-management-application:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      APP_SECURITY_USERNAME: api-user
      APP_SECURITY_PASSWORD: "{noop}change-me"
      REQUEST_CACHE_MAX_SIZE: 10000
      REQUEST_CACHE_TTL_SECONDS: 30
    restart: unless-stopped
