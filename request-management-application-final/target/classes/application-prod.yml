spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
resilience4j:
  bulkhead:
    instances:
      requestRead:
        maxConcurrentCalls: ${RESILIENCE_READ_BULKHEAD_MAX_CONCURRENT:40}
        maxWaitDuration: 0
      requestWrite:
        maxConcurrentCalls: ${RESILIENCE_WRITE_BULKHEAD_MAX_CONCURRENT:20}
        maxWaitDuration: 0
  ratelimiter:
    instances:
      requestRead:
        limitForPeriod: ${RESILIENCE_READ_RATE_LIMIT:100}
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      requestWrite:
        limitForPeriod: ${RESILIENCE_WRITE_RATE_LIMIT:20}
        limitRefreshPeriod: 1s
        timeoutDuration: 0