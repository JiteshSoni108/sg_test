spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:reqdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema_dev.sql
  h2:
    console:
      enabled: true
      path: /h2-console
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
resilience4j:
  bulkhead:
    instances:
      requestRead:
        maxConcurrentCalls: ${RESILIENCE_READ_BULKHEAD_MAX_CONCURRENT:10}
        maxWaitDuration: 0
      requestWrite:
        maxConcurrentCalls: ${RESILIENCE_WRITE_BULKHEAD_MAX_CONCURRENT:5}
        maxWaitDuration: 0
  ratelimiter:
    instances:
      requestRead:
        limitForPeriod: ${RESILIENCE_READ_RATE_LIMIT:20}
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      requestWrite:
        limitForPeriod: ${RESILIENCE_WRITE_RATE_LIMIT:5}
        limitRefreshPeriod: 1s
        timeoutDuration: 0